plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.dsh.sportscam'
    compileSdk 34

    // ---- 发布签名（第十轮）----
    // 密钥与密码放在 local.properties（已 .gitignore 排除，绝不进仓库）：
    //   RELEASE_STORE_FILE / RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD
    // local.properties 缺失时签名配置为空 ⇒ assembleRelease 产出的就是 unsigned 包（不影响开源构建）
    def localProps = new Properties()
    def localFile = rootProject.file('local.properties')
    if (localFile.exists()) { localFile.withInputStream { localProps.load(it) } }
    def hasReleaseKey = localProps.getProperty('RELEASE_STORE_FILE') != null
    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(localProps.getProperty('RELEASE_STORE_FILE'))
                storePassword localProps.getProperty('RELEASE_STORE_PASSWORD')
                keyAlias localProps.getProperty('RELEASE_KEY_ALIAS')
                keyPassword localProps.getProperty('RELEASE_KEY_PASSWORD')
            }
        }
    }

    defaultConfig {
        // ---- 包名：精确占用《超级小副屏》的包名 cn.pashiguoke.subscreen ----
        // 同前缀子名（cn.pashiguoke.subscreen.launcher）实测**仍然会被 ROM 拦**，
        // 说明判定是按包名精确匹配（或包名+签名），不是前缀。
        //
        // ⚠ 代价（用户已确认接受）：
        //   1) 必须**先卸载**原版超级小副屏才能装（签名不同，无法覆盖）；
        //   2) 装了我们之后，原版小副屏与我们的应用**不能共存**（同名）；
        //   3) 原版 APK 已备份：Android_APK\超级小副屏-原版备份.apk
        //      （CN=yumeao，证书 SHA-256 41b99151…，与设备上那份同版本 1.6/versionCode 3）
        //      要恢复：先卸载本应用，再 `pm install -r -t` 那个备份即可。
        applicationId "cn.pashiguoke.subscreen"

        // ---- 故意对齐《超级小副屏》的 minSdk 28 / targetSdk 29 ----
        // targetSdk 29 是原版两个关键行为的前提：
        //  1) 0×0 悬浮窗 + LayoutParams.screenOrientation 锁方向（Android 12 起对
        //     targetSdk≥31 的非 trusted 覆盖窗失效）；
        //  2) 不受 Android 12/13/14 的新增限制（前台服务类型、通知权限、
        //     exported 强制声明等），也因此更可能绕过 ROM 的副屏兼容性判定。
        // 我们运行在 Android 13 真机上，低 targetSdk 由系统的兼容层兜住。
        minSdk 29
        targetSdk 29
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            if (hasReleaseKey) { signingConfig signingConfigs.release }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'

    implementation platform('androidx.compose:compose-bom:2024.09.02')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    // 相机 / 相册 / 视频 / 手电筒 / 应用列表 图标
    implementation 'androidx.compose.material:material-icons-extended'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.compose.ui:ui-tooling-preview'

    // ---- 副屏能力：Shizuku 特权 shell 通道 ----
    // 用于「把别的 App 搬到副屏(move-stack)」「改副屏分辨率/DPI」「改屏幕方向」等
    // 只有 shell(uid 2000) 才有的操作。
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
